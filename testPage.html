<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Neucha&family=Playpen+Sans&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'fox-orange': '#FF9F5B',
            'fox-purple': '#6B5B95',
            'fox-teal': '#4DB6AC',
            'soft-beige': '#F9F6F0',
            'warm-gray': '#7D7D7D',
          },
          fontFamily: {
            header: ['"Gamja Flower"', 'cursive'],
            subheader: ['"Neucha"', 'cursive'],
            paragraph: ['"Playpen Sans"', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <title>Test Page</title>
</head>
<body class="bg-soft-beige text-warm-gray font-paragraph">
  <header class="text-center py-10">
    <h1 class="text-4xl font-header text-fox-purple">Welcome to My Test Page</h1>
    <p class="text-xl font-subheader text-fox-orange mt-4">This is a subheader with custom colors.</p>
    <p class="mt-4">This is a paragraph to test the theme and font styles. Let's see if it all works correctly!</p>
  </header>
</body>
</html>
